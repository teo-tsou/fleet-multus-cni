---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: adopt-multus-crd-sa
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: adopt-multus-crd-role
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "patch", "update", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: adopt-multus-crd-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: adopt-multus-crd-role
subjects:
  - kind: ServiceAccount
    name: adopt-multus-crd-sa
    namespace: kube-system
---
apiVersion: batch/v1
kind: Job
metadata:
  name: adopt-multus-crd
  namespace: kube-system
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: adopt-multus-crd-sa
      restartPolicy: OnFailure
      containers:
        - name: adopt-crd
          image: bitnami/kubectl:latest
          command:
            - sh
            - -c
            - |
              kubectl annotate crd network-attachment-definitions.k8s.cni.cncf.io \
                meta.helm.sh/release-name=multus-cni \
                meta.helm.sh/release-namespace=kube-system \
                --overwrite || true
              kubectl label crd network-attachment-definitions.k8s.cni.cncf.io \
                app.kubernetes.io/managed-by=Helm \
                --overwrite || true
              echo "Done."
